  <g transform="translate(30,40)">
    <text x="100" y="18" font-size="22" font-weight="bold" text-anchor="middle">2,50</text>
    <rect x="0" y="30" width="40" height="28" fill="#a87408" stroke="#222" stroke-width="1.5"/>
