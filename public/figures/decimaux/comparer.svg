<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Comparer 2,5 et 2,37 : on écrit 2,50 ; même partie entière, puis les dixièmes : 5 dixièmes plus grand que 3 dixièmes, donc 2,5 &gt; 2,37. Dire 37 &gt; 5 est faux.</title><rect x="74" y="8" width="84" height="30" fill="#d1495b" stroke="none" stroke-width="1.5"/><text x="116" y="29" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">u</text><rect x="158" y="8" width="84" height="30" fill="#2a6fbe" stroke="none" stroke-width="1.5"/><text x="200" y="29" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">dixièmes</text><rect x="242" y="8" width="84" height="30" fill="#e0a21b" stroke="none" stroke-width="1.5"/><text x="284" y="29" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">centièmes</text><rect x="74" y="40" width="84" height="52" fill="#fff" stroke="#bbb" stroke-width="1.5"/><text x="116" y="78" text-anchor="middle" font-size="34" font-weight="bold" fill="#1b1f24">2</text><rect x="158" y="40" width="84" height="52" fill="#e3f4e8" stroke="#3c9a5f" stroke-width="3"/><text x="200" y="78" text-anchor="middle" font-size="34" font-weight="bold" fill="#1b1f24">5</text><rect x="242" y="40" width="84" height="52" fill="#fff" stroke="#bbb" stroke-width="1.5"/><text x="284" y="78" text-anchor="middle" font-size="34" font-weight="bold" fill="#aaa">0</text><circle cx="158" cy="80" r="4" fill="#1b1f24" stroke="none" stroke-width="2"/><rect x="74" y="98" width="84" height="52" fill="#fff" stroke="#bbb" stroke-width="1.5"/><text x="116" y="136" text-anchor="middle" font-size="34" font-weight="bold" fill="#1b1f24">2</text><rect x="158" y="98" width="84" height="52" fill="#e3f4e8" stroke="#3c9a5f" stroke-width="3"/><text x="200" y="136" text-anchor="middle" font-size="34" font-weight="bold" fill="#1b1f24">3</text><rect x="242" y="98" width="84" height="52" fill="#fff" stroke="#bbb" stroke-width="1.5"/><text x="284" y="136" text-anchor="middle" font-size="34" font-weight="bold" fill="#1b1f24">7</text><circle cx="158" cy="138" r="4" fill="#1b1f24" stroke="none" stroke-width="2"/><text x="40" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b636d">2,5</text><text x="40" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b636d">2,37</text><text x="200" y="178" text-anchor="middle" font-size="17" font-weight="bold" fill="#3c9a5f">5 dixièmes &gt; 3 dixièmes</text><text x="170" y="214" text-anchor="middle" font-size="28" font-weight="bold" fill="#3c9a5f">2,5 &gt; 2,37</text><g transform="translate(26 250) scale(1)"><circle r="13" fill="#b3261e"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g><text x="46" y="257" text-anchor="start" font-size="16" font-weight="bold" fill="#b3261e">« 37 &gt; 5, donc 2,37 &gt; 2,5 » : faux !</text></svg>
