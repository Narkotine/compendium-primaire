    <text x="130" y="118" font-size="12" text-anchor="middle" fill="#333">5 dixièmes</text>
  </g>
  <text x="280" y="95" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f7a3d">&gt;</text>
  <!-- 2,37 -->
  <g transform="translate(320,40)">
    <text x="100" y="18" font-size="22" font-weight="bold" text-anchor="middle">2,37</text>
    <rect x="0" y="30" width="40" height="28" fill="#a87408" stroke="#222" stroke-width="1.5"/>
    <rect x="40" y="30" width="40" height="28" fill="#a87408" stroke="#222" stroke-width="1.5"/>
    <text x="40" y="50" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2 u</text>
    <rect x="90" y="30" width="20" height="70" fill="#2a6fbe" stroke="#222" stroke-width="1.5"/>
    <rect x="110" y="30" width="20" height="70" fill="#2a6fbe" stroke="#222" stroke-width="1.5"/>
    <rect x="130" y="30" width="20" height="70" fill="#2a6fbe" stroke="#222" stroke-width="1.5"/>
