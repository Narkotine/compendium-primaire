<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Pour 2,5 + 1,25, on aligne les virgules : 2,50 + 1,25 = 3,75. Aligner les derniers chiffres à droite donne un résultat faux.</title><rect x="6" y="6" width="162" height="220" rx="12" fill="#e8f5ec" stroke="#1f7a3d" stroke-width="2.5"/><rect x="172" y="6" width="162" height="220" rx="12" fill="#fdecee" stroke="#b3261e" stroke-width="2.5"/><line x1="84" y1="38" x2="84" y2="176" stroke="#1f7a3d" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="132" y="76" text-anchor="end" font-size="30" font-weight="bold" xml:space="preserve">2,50</text><text x="132" y="120" text-anchor="end" font-size="30" font-weight="bold" xml:space="preserve">1,25</text><text x="132" y="176" text-anchor="end" font-size="30" font-weight="bold" xml:space="preserve">3,75</text><text x="26" y="120" text-anchor="middle" font-size="30" font-weight="bold">+</text><line x1="22" y1="136" x2="150" y2="136" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><g transform="translate(87 204) scale(1)"><circle r="13" fill="#1f7a3d"/><path d="M-6 0 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="298" y="76" text-anchor="end" font-size="30" font-weight="bold" xml:space="preserve">2,5</text><text x="298" y="120" text-anchor="end" font-size="30" font-weight="bold" xml:space="preserve">1,25</text><text x="298" y="176" text-anchor="end" font-size="30" font-weight="bold" xml:space="preserve">1,50</text><text x="192" y="120" text-anchor="middle" font-size="30" font-weight="bold">+</text><line x1="188" y1="136" x2="316" y2="136" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><g transform="translate(253 204) scale(1)"><circle r="13" fill="#b3261e"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g></svg>
