<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" font-family="sans-serif">
  <line x1="20" y1="40" x2="540" y2="40" stroke="#222" stroke-width="2.5"/>
  <path d="M540 34 L550 40 L540 46" fill="none" stroke="#222" stroke-width="2.5"/>
  <!-- ticks 0 to 3 -->
  <g stroke="#222" stroke-width="2">
    <line x1="40" y1="28" x2="40" y2="52"/><line x1="200" y1="28" x2="200" y2="52"/>
    <line x1="360" y1="28" x2="360" y2="52"/><line x1="520" y1="28" x2="520" y2="52"/>
  </g>
  <text x="40" y="72" font-size="16" font-weight="bold" text-anchor="middle">0</text>
  <text x="200" y="72" font-size="16" font-weight="bold" text-anchor="middle">1</text>
  <text x="360" y="72" font-size="16" font-weight="bold" text-anchor="middle">2</text>
  <text x="520" y="72" font-size="16" font-weight="bold" text-anchor="middle">3</text>
  <!-- zoom bracket between 2 and 3 -->
  <path d="M360 80 L360 88 L520 88 L520 80" fill="none" stroke="#2a6fbe" stroke-width="2"/>
  <text x="440" y="108" font-size="13" fill="#2a6fbe" text-anchor="middle" font-weight="bold">zoom : 2,0 · 2,1 · 2,2 · … · 2,9 · 3,0</text>
  <!-- mark 2,4 -->
  <circle cx="424" cy="40" r="7" fill="#d1495b"/>
  <text x="424" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#d1495b">2,4</text>
</svg>
