<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 266" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>7 × 46,55 € : on calcule sans la virgule, 7 × 4 655 = 32 585, puis on remet 2 chiffres après la virgule : 325,85 €. Ordre de grandeur : 7 × 50, environ 350.</title><text x="170" y="34" text-anchor="middle" font-size="26" font-weight="bold">7 × 46,55 € ?</text><line x1="170" y1="48" x2="170.0" y2="70.0" stroke="#5b636d" stroke-width="3" stroke-linecap="round"/><polygon points="170,76 174.3,67.0 165.7,67.0" fill="#5b636d"/><text x="186" y="68" text-anchor="start" font-size="14" font-weight="bold" fill="#5b636d">sans la virgule</text><text x="170" y="108" text-anchor="middle" font-size="24" font-weight="bold" xml:space="preserve"><tspan fill="#1b1f24">7 × 4 655 = 32 585</tspan></text><line x1="170" y1="120" x2="170.0" y2="134.0" stroke="#5b636d" stroke-width="3" stroke-linecap="round"/><polygon points="170,140 174.3,131.0 165.7,131.0" fill="#5b636d"/><text x="170" y="162" text-anchor="middle" font-size="15" font-weight="bold" xml:space="preserve"><tspan fill="#5b636d">46,</tspan><tspan fill="#d1495b">55</tspan><tspan fill="#5b636d"> : 2 chiffres après la virgule</tspan></text><text x="170" y="204" text-anchor="middle" font-size="32" font-weight="bold" xml:space="preserve"><tspan fill="#2a6fbe">325,</tspan><tspan fill="#d1495b">85</tspan><tspan fill="#2a6fbe"> €</tspan></text><g transform="translate(60 244) scale(1)"><circle r="13" fill="#1f7a3d"/><path d="M-6 0 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="251" text-anchor="start" font-size="17" font-weight="bold" fill="#1f7a3d">Vérifie : 7 × 50 ≈ 350</text></svg>
