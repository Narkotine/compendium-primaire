<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 294" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Double de 35 : on coupe en 30 et 5, double de 30 = 60, double de 5 = 10, total 70. La moitié de 70 est 35, car 35 + 35 = 70.</title><rect x="135" y="14" width="70" height="38" rx="8" fill="#fff" stroke="#1b1f24" stroke-width="2.5"/><text x="170" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b1f24">35</text><line x1="150" y1="54" x2="105.3" y2="77.2" stroke="#5b636d" stroke-width="2.5" stroke-linecap="round"/><polygon points="100,80 110.0,79.7 106.0,72.0" fill="#5b636d"/><line x1="190" y1="54" x2="234.7" y2="77.2" stroke="#5b636d" stroke-width="2.5" stroke-linecap="round"/><polygon points="240,80 234.0,72.0 230.0,79.7" fill="#5b636d"/><rect x="58" y="86" width="64" height="38" rx="8" fill="#fff" stroke="#2a6fbe" stroke-width="2.5"/><text x="90" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a6fbe">30</text><rect x="218" y="86" width="64" height="38" rx="8" fill="#fff" stroke="#3c9a5f" stroke-width="2.5"/><text x="250" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#3c9a5f">5</text><line x1="90" y1="126" x2="90.0" y2="154.0" stroke="#2a6fbe" stroke-width="2.5" stroke-linecap="round"/><polygon points="90,160 94.3,151.0 85.7,151.0" fill="#2a6fbe"/><line x1="250" y1="126" x2="250.0" y2="154.0" stroke="#3c9a5f" stroke-width="2.5" stroke-linecap="round"/><polygon points="250,160 254.3,151.0 245.7,151.0" fill="#3c9a5f"/><text x="108" y="150" text-anchor="start" font-size="15" font-weight="bold" fill="#2a6fbe">× 2</text><text x="268" y="150" text-anchor="start" font-size="15" font-weight="bold" fill="#3c9a5f">× 2</text><rect x="58" y="166" width="64" height="38" rx="8" fill="#fff" stroke="#2a6fbe" stroke-width="2.5"/><text x="90" y="192" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a6fbe">60</text><rect x="218" y="166" width="64" height="38" rx="8" fill="#fff" stroke="#3c9a5f" stroke-width="2.5"/><text x="250" y="192" text-anchor="middle" font-size="24" font-weight="bold" fill="#3c9a5f">10</text><text x="170" y="248" text-anchor="middle" font-size="20" font-weight="bold" xml:space="preserve"><tspan fill="#1b1f24">double de 35 = </tspan><tspan fill="#2a6fbe">60</tspan><tspan fill="#1b1f24"> + </tspan><tspan fill="#3c9a5f">10</tspan><tspan fill="#1b1f24"> = 70</tspan></text><text x="170" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b636d">moitié de 70 = 35, car 35 + 35 = 70</text></svg>
