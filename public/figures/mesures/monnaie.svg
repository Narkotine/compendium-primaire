<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>On paie 2,40 € avec un billet de 5 €. On rend 5 − 2,40 = 2,60 € : une pièce de 2 €, une de 50 centimes et une de 10 centimes. 1 € = 100 centimes.</title><rect x="10" y="30" width="96" height="52" rx="6" fill="#c7e3cf" stroke="#1f5a36" stroke-width="2"/><text x="58" y="64" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f5a36">5 €</text><text x="130" y="64" text-anchor="middle" font-size="28" font-weight="bold">−</text><rect x="150" y="34" width="70" height="44" rx="8" fill="#fff" stroke="#1b1f24" stroke-width="2"/><text x="185" y="62" text-anchor="middle" font-size="17" font-weight="bold">2,40 €</text><text x="238" y="64" text-anchor="middle" font-size="28" font-weight="bold">=</text><circle cx="276" cy="46" r="22" fill="#e9c46a" stroke="#7a5a10" stroke-width="2"/><text x="276" y="51" text-anchor="middle" font-size="14" font-weight="bold">2 €</text><circle cx="310" cy="72" r="15" fill="#f3d98b" stroke="#7a5a10" stroke-width="2"/><text x="310" y="77" text-anchor="middle" font-size="11" font-weight="bold">50 c</text><circle cx="286" cy="84" r="12" fill="#f3d98b" stroke="#7a5a10" stroke-width="2"/><text x="286" y="89" text-anchor="middle" font-size="11" font-weight="bold">10 c</text><text x="170" y="130" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a6fbe">On rend 2,60 €</text><text x="170" y="162" text-anchor="middle" font-size="20" font-weight="bold">5 − 2,40 = 2,60</text><text x="170" y="196" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b636d">1 € = 100 centimes</text></svg>
