<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 242" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>L’aire du rectangle : 5 rangées de 3 carreaux de 1 cm², donc 5 × 3 = 15 cm².</title><rect x="40" y="14" width="36" height="36" fill="#e0a21b" stroke="#fff" stroke-width="2"/><rect x="76" y="14" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="112" y="14" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="40" y="50" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="76" y="50" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="112" y="50" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="40" y="86" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="76" y="86" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="112" y="86" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="40" y="122" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="76" y="122" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="112" y="122" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="40" y="158" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="76" y="158" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><rect x="112" y="158" width="36" height="36" fill="#3c9a5f" stroke="#fff" stroke-width="2"/><line x1="194" y1="30" x2="164.0" y2="30.0" stroke="#7a5a10" stroke-width="2.5" stroke-linecap="round"/><polygon points="158,30 167.0,34.3 167.0,25.7" fill="#7a5a10"/><text x="202" y="36" text-anchor="start" font-size="18" font-weight="bold" fill="#7a5a10">1 cm²</text><text x="202" y="84" text-anchor="start" font-size="18" font-weight="bold" fill="#3c9a5f">5 rangées</text><text x="202" y="110" text-anchor="start" font-size="18" font-weight="bold" fill="#3c9a5f">de 3 carreaux</text><text x="170" y="228" text-anchor="middle" font-size="26" font-weight="bold">5 × 3 = 15 cm²</text></svg>
