<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 258" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>De 8 h 50 à 9 h 20 : 10 minutes jusqu’à 9 h, puis 20 minutes. Durée 30 minutes. 1 h 50 + 20 min ne fait pas 1 h 70 mais 2 h 10.</title><line x1="12" y1="110" x2="330" y2="110" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="98" x2="40" y2="122" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><line x1="83.33333333333334" y1="104" x2="83.33333333333334" y2="116" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><line x1="126.66666666666667" y1="98" x2="126.66666666666667" y2="122" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="104" x2="170" y2="116" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><line x1="213.33333333333334" y1="98" x2="213.33333333333334" y2="122" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><line x1="256.66666666666663" y1="104" x2="256.66666666666663" y2="116" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><line x1="300" y1="98" x2="300" y2="122" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><text x="40" y="148" text-anchor="middle" font-size="17" font-weight="bold">8 h 50</text><text x="126.66666666666667" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a6fbe">9 h 00</text><text x="300" y="148" text-anchor="middle" font-size="17" font-weight="bold">9 h 20</text><path d="M40 106 Q83.33333333333334 54 122.2 100.6" fill="none" stroke="#2a6fbe" stroke-width="3" stroke-linecap="round"/><polygon points="126.66666666666667,106 124.5,95.2 116.4,102.0" fill="#2a6fbe"/><text x="83.33333333333334" y="74" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a6fbe">+ 10 min</text><path d="M126.66666666666667 106 Q213.33333333333334 38 294.5 101.7" fill="none" stroke="#3c9a5f" stroke-width="3" stroke-linecap="round"/><polygon points="300,106 295.7,95.9 289.1,104.2" fill="#3c9a5f"/><text x="213.33333333333334" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c9a5f">+ 20 min</text><text x="170" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b636d">Passe par l’heure pile.</text><text x="170" y="194" text-anchor="middle" font-size="24" font-weight="bold" xml:space="preserve"><tspan fill="#1b1f24">durée : </tspan><tspan fill="#3c9a5f">30 min</tspan></text><g transform="translate(20 236) scale(1)"><circle r="13" fill="#b3261e"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g><text x="40" y="243" text-anchor="start" font-size="15.5" font-weight="bold" fill="#b3261e">1 h 50 + 20 min = 1 h 70 ? Non : 2 h 10</text></svg>
