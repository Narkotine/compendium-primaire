<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 140" font-family="sans-serif" font-size="16"><rect x="10" y="10" width="110" height="34" fill="#d1495b"/><text x="65" y="33" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">centaines</text><rect x="10" y="44" width="110" height="56" fill="#fff" stroke="#333"/><text x="65" y="84" text-anchor="middle" font-size="36" font-weight="bold">3</text><rect x="120" y="10" width="110" height="34" fill="#2a6fbe"/><text x="175" y="33" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">dizaines</text><rect x="120" y="44" width="110" height="56" fill="#fff" stroke="#333"/><text x="175" y="84" text-anchor="middle" font-size="36" font-weight="bold">5</text><rect x="230" y="10" width="110" height="34" fill="#e0a21b"/><text x="285" y="33" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">unités</text><rect x="230" y="44" width="110" height="56" fill="#fff" stroke="#333"/><text x="285" y="84" text-anchor="middle" font-size="36" font-weight="bold">2</text><text x="175" y="128" text-anchor="middle" font-size="14" >3 centaines + 5 dizaines + 2 unités = 300 + 50 + 2</text></svg>