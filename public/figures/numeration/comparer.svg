<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Comparer 243 et 239 de gauche à droite : centaines pareilles, dizaines 4 et 3 différentes, donc 243 > 239.</title><text x="76" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b636d">① pareil</text><text x="160" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c9a5f">② différent</text><rect x="42" y="36" width="68" height="128" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5"/><text x="76" y="90" text-anchor="middle" font-size="48" font-weight="bold" fill="#1b1f24">2</text><text x="76" y="150" text-anchor="middle" font-size="48" font-weight="bold" fill="#1b1f24">2</text><rect x="126" y="36" width="68" height="128" rx="10" fill="#e3f4e8" stroke="#3c9a5f" stroke-width="4"/><text x="160" y="90" text-anchor="middle" font-size="48" font-weight="bold" fill="#1b1f24">4</text><text x="160" y="150" text-anchor="middle" font-size="48" font-weight="bold" fill="#1b1f24">3</text><rect x="210" y="36" width="68" height="128" rx="10" fill="#f2f2f2" stroke="#bbb" stroke-width="1.5"/><text x="244" y="90" text-anchor="middle" font-size="48" font-weight="bold" fill="#aaa">3</text><text x="244" y="150" text-anchor="middle" font-size="48" font-weight="bold" fill="#aaa">9</text><text x="304" y="92" text-anchor="middle" font-size="16" fill="#5b636d">243</text><text x="304" y="152" text-anchor="middle" font-size="16" fill="#5b636d">239</text><text x="170" y="210" text-anchor="middle" font-size="24" font-weight="bold" fill="#3c9a5f">4 > 3, donc 243 > 239</text><text x="170" y="238" text-anchor="middle" font-size="16" fill="#5b636d">La pointe montre le plus petit.</text></svg>
