<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 264" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>24 ÷ 4 : je cherche 4 fois combien font 24. 4 × 6 = 24, donc 24 ÷ 4 = 6. La famille 7, 13, 91 : 7 × 13 = 91, 91 ÷ 7 = 13, 91 ÷ 13 = 7.</title><text x="170" y="34" text-anchor="middle" font-size="26" font-weight="bold" xml:space="preserve"><tspan fill="#1b1f24">24 ÷ 4 = </tspan><tspan fill="#d1495b">?</tspan></text><line x1="170" y1="46" x2="170.0" y2="68.0" stroke="#5b636d" stroke-width="3" stroke-linecap="round"/><polygon points="170,74 174.3,65.0 165.7,65.0" fill="#5b636d"/><text x="186" y="66" text-anchor="start" font-size="14" font-weight="bold" fill="#5b636d">je cherche</text><text x="170" y="104" text-anchor="middle" font-size="26" font-weight="bold" xml:space="preserve"><tspan fill="#1b1f24">4 × </tspan><tspan fill="#d1495b">6</tspan><tspan fill="#1b1f24"> = 24</tspan></text><line x1="10" y1="128" x2="330" y2="128" stroke="#ddd" stroke-width="2" stroke-linecap="round"/><polygon points="80,146 20,250 140,250" fill="#eef4fb" stroke="#2a6fbe" stroke-width="3" stroke-linejoin="round"/><text x="80" y="186" text-anchor="middle" font-size="26" font-weight="bold">91</text><text x="50" y="238" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a6fbe">7</text><text x="110" y="238" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a6fbe">13</text><text x="170" y="170" text-anchor="start" font-size="21" font-weight="bold">7 × 13 = 91</text><text x="170" y="210" text-anchor="start" font-size="21" font-weight="bold" fill="#2a6fbe">91 ÷ 7 = 13</text><text x="170" y="250" text-anchor="start" font-size="21" font-weight="bold" fill="#2a6fbe">91 ÷ 13 = 7</text></svg>
