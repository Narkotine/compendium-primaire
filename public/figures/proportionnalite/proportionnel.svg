<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 292" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Proportionnel : le prix de tee-shirts au même prix, les œufs d’une recette. Pas proportionnel : la taille selon l’âge, un manège à 5 € d’entrée plus 2 € par tour, une promotion 3 melons pour le prix de 2.</title><rect x="6" y="8" width="328" height="42" rx="10" fill="#e8f5ec" stroke="#1f7a3d" stroke-width="2"/><text x="18" y="35" text-anchor="start" font-size="16" font-weight="bold">Tee-shirts au même prix</text><g transform="translate(312 29) scale(1)"><circle r="13" fill="#1f7a3d"/><path d="M-6 0 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="6" y="58" width="328" height="42" rx="10" fill="#e8f5ec" stroke="#1f7a3d" stroke-width="2"/><text x="18" y="85" text-anchor="start" font-size="16" font-weight="bold">Œufs d’une recette</text><g transform="translate(312 79) scale(1)"><circle r="13" fill="#1f7a3d"/><path d="M-6 0 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="6" y="108" width="328" height="42" rx="10" fill="#fdecee" stroke="#b3261e" stroke-width="2"/><text x="18" y="135" text-anchor="start" font-size="16" font-weight="bold">Taille selon l’âge</text><g transform="translate(312 129) scale(1)"><circle r="13" fill="#b3261e"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g><rect x="6" y="158" width="328" height="42" rx="10" fill="#fdecee" stroke="#b3261e" stroke-width="2"/><text x="18" y="185" text-anchor="start" font-size="16" font-weight="bold">Manège : 5 € + 2 € par tour</text><g transform="translate(312 179) scale(1)"><circle r="13" fill="#b3261e"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g><rect x="6" y="208" width="328" height="42" rx="10" fill="#fdecee" stroke="#b3261e" stroke-width="2"/><text x="18" y="235" text-anchor="start" font-size="16" font-weight="bold">3 melons pour le prix de 2</text><g transform="translate(312 229) scale(1)"><circle r="13" fill="#b3261e"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g><text x="170" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b636d">2 fois plus d’un côté → 2 fois plus de l’autre ?</text></svg>
