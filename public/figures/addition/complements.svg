<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 262" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Pour aller de 64 à 100 : + 6 jusqu’à 70, puis + 30. 64 + 36 = 100. Attention : 64 + 46 = 110.</title><line x1="14" y1="120" x2="330" y2="120" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><line x1="53.61904761904762" y1="110" x2="53.61904761904762" y2="130" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><text x="53.61904761904762" y="154" text-anchor="middle" font-size="20" font-weight="bold">64</text><line x1="95.04761904761905" y1="110" x2="95.04761904761905" y2="130" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><text x="95.04761904761905" y="154" text-anchor="middle" font-size="20" font-weight="bold">70</text><line x1="302.1904761904762" y1="110" x2="302.1904761904762" y2="130" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><text x="302.1904761904762" y="154" text-anchor="middle" font-size="20" font-weight="bold">100</text><path d="M53.61904761904762 116 Q74.33333333333334 60 92.6 109.4" fill="none" stroke="#3c9a5f" stroke-width="3" stroke-linecap="round"/><polygon points="95.04761904761905,116 96.6,105.1 86.8,108.8" fill="#3c9a5f"/><text x="74.33333333333334" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c9a5f">+ 6</text><path d="M95.04761904761905 116 Q198.61904761904762 28 296.9 111.5" fill="none" stroke="#3c9a5f" stroke-width="3" stroke-linecap="round"/><polygon points="302.1904761904762,116 298.2,105.7 291.4,113.8" fill="#3c9a5f"/><text x="198.61904761904762" y="66" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c9a5f">+ 30</text><text x="170" y="196" text-anchor="middle" font-size="26" font-weight="bold" xml:space="preserve"><tspan fill="#1b1f24">64 + </tspan><tspan fill="#3c9a5f">36</tspan><tspan fill="#1b1f24"> = 100</tspan></text><g transform="translate(40 238) scale(1)"><circle r="13" fill="#b3261e"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g><text x="62" y="245" text-anchor="start" font-size="18" font-weight="bold" fill="#b3261e">64 + 46 = 110, pas 100 !</text></svg>
