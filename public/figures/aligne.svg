<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" font-family="sans-serif">
  <text x="200" y="22" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">Aligne les virgules (= les unités)</text>
  <!-- good -->
  <g transform="translate(40,40)" font-size="22" font-weight="bold" font-family="monospace">
    <text x="0" y="0" fill="#1f7a3d">Bien</text>
    <text x="20" y="30" fill="#111">  2,50</text>
    <text x="20" y="56" fill="#111">+ 1,25</text>
    <line x1="20" y1="64" x2="100" y2="64" stroke="#222" stroke-width="2"/>
    <text x="20" y="90" fill="#111">  3,75</text>
    <line x1="78" y1="8" x2="78" y2="92" stroke="#2a6fbe" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>
  <!-- bad -->
  <g transform="translate(220,40)" font-size="22" font-weight="bold" font-family="monospace">
    <text x="0" y="0" fill="#d1495b">Faux</text>
    <text x="20" y="30" fill="#888">  2,5</text>
    <text x="20" y="56" fill="#888">+1,25</text>
    <line x1="20" y1="64" x2="90" y2="64" stroke="#888" stroke-width="2"/>
    <text x="20" y="90" fill="#888"> 1,50 ?</text>
    <text x="0" y="118" font-size="12" font-weight="normal" fill="#d1495b">aligné à droite ✗</text>
  </g>
</svg>
