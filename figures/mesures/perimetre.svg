<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 224" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Un rectangle de 8 cm sur 3 cm. On fait le tour : 8 + 3 + 8 + 3 = 22 cm. Le périmètre, c’est la longueur du tour.</title><rect x="50" y="40" width="240" height="90" fill="#eef4fb" stroke="#2a6fbe" stroke-width="4"/><rect x="36" y="26" width="268" height="118" rx="14" fill="none" stroke="#d1495b" stroke-width="2.5" stroke-dasharray="7 6"/><polygon points="170,20 182,26 170,32" fill="#d1495b"/><text x="170" y="66" text-anchor="middle" font-size="18" font-weight="bold">8 cm</text><text x="170" y="122" text-anchor="middle" font-size="18" font-weight="bold">8 cm</text><text x="62" y="92" text-anchor="start" font-size="16" font-weight="bold">3 cm</text><text x="278" y="92" text-anchor="end" font-size="16" font-weight="bold">3 cm</text><text x="170" y="180" text-anchor="middle" font-size="26" font-weight="bold" fill="#d1495b">8 + 3 + 8 + 3 = 22 cm</text><text x="170" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b636d">Le périmètre, c’est le tour.</text></svg>
