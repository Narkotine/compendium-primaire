<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Le tableau des longueurs, du km au mm : 1 m = 100 cm, comme 1 centaine = 100 unités. Kilo : 1 km = 1 000 m. Centi : 100 cm = 1 m. Milli : 1 000 mm = 1 m.</title><rect x="9" y="10" width="46" height="32" fill="#6a4bb5" stroke="#fff" stroke-width="1"/><text x="32" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">km</text><rect x="9" y="42" width="46" height="50" fill="#fff" stroke="#bbb" stroke-width="1.5"/><rect x="55" y="10" width="46" height="32" fill="#7d8a99" stroke="#fff" stroke-width="1"/><text x="78" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">hm</text><rect x="55" y="42" width="46" height="50" fill="#fff" stroke="#bbb" stroke-width="1.5"/><rect x="101" y="10" width="46" height="32" fill="#7d8a99" stroke="#fff" stroke-width="1"/><text x="124" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">dam</text><rect x="101" y="42" width="46" height="50" fill="#fff" stroke="#bbb" stroke-width="1.5"/><rect x="147" y="10" width="46" height="32" fill="#d1495b" stroke="#fff" stroke-width="1"/><text x="170" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">m</text><rect x="147" y="42" width="46" height="50" fill="#fff" stroke="#bbb" stroke-width="1.5"/><rect x="193" y="10" width="46" height="32" fill="#7d8a99" stroke="#fff" stroke-width="1"/><text x="216" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">dm</text><rect x="193" y="42" width="46" height="50" fill="#fff" stroke="#bbb" stroke-width="1.5"/><rect x="239" y="10" width="46" height="32" fill="#2a6fbe" stroke="#fff" stroke-width="1"/><text x="262" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">cm</text><rect x="239" y="42" width="46" height="50" fill="#fff" stroke="#bbb" stroke-width="1.5"/><rect x="285" y="10" width="46" height="32" fill="#2a6fbe" stroke="#fff" stroke-width="1"/><text x="308" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">mm</text><rect x="285" y="42" width="46" height="50" fill="#fff" stroke="#bbb" stroke-width="1.5"/><text x="170" y="80" text-anchor="middle" font-size="30" font-weight="bold" fill="#d1495b">1</text><text x="216" y="80" text-anchor="middle" font-size="30" font-weight="bold">0</text><text x="262" y="80" text-anchor="middle" font-size="30" font-weight="bold" fill="#2a6fbe">0</text><text x="170" y="130" text-anchor="middle" font-size="26" font-weight="bold" xml:space="preserve"><tspan fill="#d1495b">1 m</tspan><tspan fill="#1b1f24"> = </tspan><tspan fill="#2a6fbe">100 cm</tspan></text><text x="170" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b636d">comme 1 centaine = 100 unités</text><rect x="6" y="178" width="104" height="44" rx="10" fill="#fff" stroke="#6a4bb5" stroke-width="2.5"/><text x="58" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a4bb5">kilo</text><text x="58" y="215" text-anchor="middle" font-size="13" font-weight="bold">1 km = 1 000 m</text><rect x="118" y="178" width="104" height="44" rx="10" fill="#fff" stroke="#2a6fbe" stroke-width="2.5"/><text x="170" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6fbe">centi</text><text x="170" y="215" text-anchor="middle" font-size="13" font-weight="bold">100 cm = 1 m</text><rect x="230" y="178" width="104" height="44" rx="10" fill="#fff" stroke="#2a6f97" stroke-width="2.5"/><text x="282" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">milli</text><text x="282" y="215" text-anchor="middle" font-size="13" font-weight="bold">1 000 mm = 1 m</text></svg>
