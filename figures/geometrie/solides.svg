<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Un cube : 6 faces carrées, 12 arêtes, 8 sommets. Un pavé : 6 faces rectangles. Une pyramide : une base et des faces triangles qui se rejoignent au sommet.</title><polygon points="14,50 78,50 78,114 14,114" fill="#cfe0f4" stroke="#2a6fbe" stroke-width="2.5"/><polygon points="14,50 40,24 104,24 78,50" fill="#fff" stroke="#2a6fbe" stroke-width="2.5"/><polygon points="78,50 104,24 104,88 78,114" fill="#ddd" stroke="#2a6fbe" stroke-width="2.5"/><path d="M14 114 L40 88 L104 88 M40 88 L40 24" stroke="#2a6fbe" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><text x="60" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#2a6fbe">cube</text><polygon points="128,66 218,66 218,114 128,114" fill="#d6efdd" stroke="#3c9a5f" stroke-width="2.5"/><polygon points="128,66 150,44 240,44 218,66" fill="#fff" stroke="#3c9a5f" stroke-width="2.5"/><polygon points="218,66 240,44 240,92 218,114" fill="#ddd" stroke="#3c9a5f" stroke-width="2.5"/><path d="M128 114 L150 92 L240 92 M150 92 L150 44" stroke="#3c9a5f" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><text x="180" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c9a5f">pavé</text><polygon points="244,108 300,124 330,104" fill="#f6d27a" stroke="#7a5a10" stroke-width="2.5"/><polygon points="244,108 300,124 286,30" fill="#e9b949" stroke="#7a5a10" stroke-width="2.5"/><polygon points="300,124 330,104 286,30" fill="#f3d98b" stroke="#7a5a10" stroke-width="2.5"/><text x="290" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5a10">pyramide</text><circle cx="14" cy="50" r="5" fill="#d1495b" stroke="none" stroke-width="2"/><circle cx="78" cy="50" r="5" fill="#d1495b" stroke="none" stroke-width="2"/><text x="170" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a6fbe">cube : 6 faces carrées</text><text x="170" y="216" text-anchor="middle" font-size="17" font-weight="bold" xml:space="preserve"><tspan fill="#2a6fbe">12 arêtes</tspan><tspan fill="#5b636d"> · </tspan><tspan fill="#d1495b">8 sommets</tspan></text></svg>
