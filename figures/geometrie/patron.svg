<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 222" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Un patron du cube : 6 carrés bien placés. En pliant, on obtient un cube.</title><rect x="118" y="12" width="54" height="54" fill="#2a6fbe55" stroke="#2a6fbe" stroke-width="3"/><text x="145" y="47" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a6fbe">1</text><rect x="64" y="66" width="54" height="54" fill="#3c9a5f55" stroke="#3c9a5f" stroke-width="3"/><text x="91" y="101" text-anchor="middle" font-size="22" font-weight="bold" fill="#3c9a5f">2</text><rect x="118" y="66" width="54" height="54" fill="#d1495b55" stroke="#d1495b" stroke-width="3"/><text x="145" y="101" text-anchor="middle" font-size="22" font-weight="bold" fill="#d1495b">3</text><rect x="172" y="66" width="54" height="54" fill="#e0a21b55" stroke="#e0a21b" stroke-width="3"/><text x="199" y="101" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5a10">4</text><rect x="226" y="66" width="54" height="54" fill="#6a4bb555" stroke="#6a4bb5" stroke-width="3"/><text x="253" y="101" text-anchor="middle" font-size="22" font-weight="bold" fill="#6a4bb5">5</text><rect x="118" y="120" width="54" height="54" fill="#2a6f9755" stroke="#2a6f97" stroke-width="3"/><text x="145" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a6f97">6</text><text x="170" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b636d">6 carrés : on plie, on obtient un cube.</text></svg>
