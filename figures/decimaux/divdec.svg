<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 246" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>45 ÷ 6 posée : 45 = 6 × 7 + 3. On écrit la virgule au quotient et on échange : 3 unités = 30 dixièmes, 30 ÷ 6 = 5. 45 ÷ 6 = 7,5.</title><text x="70" y="44" text-anchor="middle" font-size="30" font-weight="bold">4</text><text x="100" y="44" text-anchor="middle" font-size="30" font-weight="bold">5</text><line x1="150" y1="16" x2="150" y2="190" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><line x1="150" y1="56" x2="290" y2="56" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><text x="186" y="44" text-anchor="middle" font-size="30" font-weight="bold">6</text><text x="44" y="82" text-anchor="middle" font-size="26" font-weight="bold">−</text><text x="70" y="82" text-anchor="middle" font-size="26" font-weight="bold">4</text><text x="100" y="82" text-anchor="middle" font-size="26" font-weight="bold">2</text><line x1="56" y1="92" x2="116" y2="92" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><text x="100" y="122" text-anchor="middle" font-size="26" font-weight="bold">3</text><text x="126" y="122" text-anchor="middle" font-size="26" font-weight="bold" fill="#d1495b">0</text><text x="74" y="152" text-anchor="middle" font-size="26" font-weight="bold">−</text><text x="100" y="152" text-anchor="middle" font-size="26" font-weight="bold">3</text><text x="126" y="152" text-anchor="middle" font-size="26" font-weight="bold">0</text><line x1="86" y1="162" x2="140" y2="162" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><text x="126" y="186" text-anchor="middle" font-size="26" font-weight="bold">0</text><text x="186" y="92" text-anchor="middle" font-size="34" font-weight="bold">7</text><text x="208" y="92" text-anchor="middle" font-size="34" font-weight="bold" fill="#d1495b">,</text><text x="228" y="92" text-anchor="middle" font-size="34" font-weight="bold" fill="#d1495b">5</text><text x="164" y="136" text-anchor="start" font-size="15" font-weight="bold" fill="#d1495b">3 unités =</text><text x="164" y="156" text-anchor="start" font-size="15" font-weight="bold" fill="#d1495b">30 dixièmes</text><text x="170" y="230" text-anchor="middle" font-size="26" font-weight="bold">45 ÷ 6 = 7,5</text></svg>
