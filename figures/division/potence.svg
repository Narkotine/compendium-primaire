<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>612 ÷ 6 posée : 6 centaines donnent 1 centaine ; 1 dizaine est plus petite que 6, on écrit 0 au quotient ; 12 unités donnent 2. 612 ÷ 6 = 102. Vérification : 6 × 102 = 612.</title><text x="70" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#d1495b">6</text><text x="100" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#2a6fbe">1</text><text x="130" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#e0a21b">2</text><line x1="156" y1="16" x2="156" y2="214" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><line x1="156" y1="56" x2="290" y2="56" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/><text x="190" y="44" text-anchor="middle" font-size="30" font-weight="bold">6</text><text x="44" y="82" text-anchor="middle" font-size="26" font-weight="bold">−</text><text x="70" y="82" text-anchor="middle" font-size="26" font-weight="bold">6</text><line x1="46" y1="92" x2="84" y2="92" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><text x="70" y="120" text-anchor="middle" font-size="26" font-weight="bold">0</text><text x="100" y="120" text-anchor="middle" font-size="26" font-weight="bold" fill="#2a6fbe">1</text><text x="102" y="150" text-anchor="middle" font-size="26" font-weight="bold">1</text><text x="130" y="150" text-anchor="middle" font-size="26" font-weight="bold">2</text><text x="74" y="180" text-anchor="middle" font-size="26" font-weight="bold">−</text><text x="102" y="180" text-anchor="middle" font-size="26" font-weight="bold">1</text><text x="130" y="180" text-anchor="middle" font-size="26" font-weight="bold">2</text><line x1="76" y1="190" x2="146" y2="190" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/><text x="130" y="214" text-anchor="middle" font-size="26" font-weight="bold">0</text><text x="190" y="92" text-anchor="middle" font-size="34" font-weight="bold" fill="#d1495b">1</text><text x="222" y="92" text-anchor="middle" font-size="34" font-weight="bold" fill="#b3261e">0</text><text x="254" y="92" text-anchor="middle" font-size="34" font-weight="bold" fill="#e0a21b">2</text><circle cx="222" cy="80" r="20" fill="none" stroke="#b3261e" stroke-width="3"/><text x="170" y="132" text-anchor="start" font-size="15" font-weight="bold" fill="#b3261e">1 dizaine &lt; 6</text><text x="170" y="152" text-anchor="start" font-size="15" font-weight="bold" fill="#b3261e">→ 0 au quotient</text><text x="170" y="248" text-anchor="middle" font-size="22" font-weight="bold">612 ÷ 6 = 102, pas 12 !</text><text x="170" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b636d">Vérifie : 6 × 102 = 612</text></svg>
