<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>12 images pour 3 enfants : on donne une image à chacun, puis encore une. Chacun en a 4. 12 ÷ 3 = 4. Des parts de 5, 4 et 3 ne sont pas équitables.</title><text x="170" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b636d">12 images, 3 enfants</text><circle cx="60" cy="60" r="14" fill="#f3d9b1" stroke="#8a6a40" stroke-width="2"/><path d="M38 104 q0 -26 22 -26 q22 0 22 26 z" fill="#2a6fbe"/><rect x="22" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><rect x="42" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><rect x="62" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><rect x="82" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><text x="60" y="166" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a6fbe">4</text><circle cx="170" cy="60" r="14" fill="#f3d9b1" stroke="#8a6a40" stroke-width="2"/><path d="M148 104 q0 -26 22 -26 q22 0 22 26 z" fill="#3c9a5f"/><rect x="132" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><rect x="152" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><rect x="172" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><rect x="192" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><text x="170" y="166" text-anchor="middle" font-size="24" font-weight="bold" fill="#3c9a5f">4</text><circle cx="280" cy="60" r="14" fill="#f3d9b1" stroke="#8a6a40" stroke-width="2"/><path d="M258 104 q0 -26 22 -26 q22 0 22 26 z" fill="#6a4bb5"/><rect x="242" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><rect x="262" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><rect x="282" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><rect x="302" y="118" width="16" height="22" rx="3" fill="#e0a21b" stroke="#7a5a10" stroke-width="1.2"/><text x="280" y="166" text-anchor="middle" font-size="24" font-weight="bold" fill="#6a4bb5">4</text><text x="170" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b636d">un à chacun, puis encore un…</text><text x="170" y="236" text-anchor="middle" font-size="24" font-weight="bold" xml:space="preserve"><tspan fill="#2a6fbe">12 ÷ 3 = 4</tspan><tspan fill="#1b1f24"> chacun</tspan></text><g transform="translate(56 270) scale(1)"><circle r="13" fill="#b3261e"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g><text x="78" y="277" text-anchor="start" font-size="17" font-weight="bold" fill="#b3261e">5, 4 et 3 : pas équitable !</text></svg>
