    <rect x="180" y="62" width="70" height="36" fill="#e8f0fa" stroke="#222"/><text x="215" y="88">4</text>
    <rect x="250" y="62" width="80" height="36" fill="#fae8eb" stroke="#222"/><text x="290" y="88">1</text>
  </g>
  <text x="400" y="85" font-size="18" font-weight="bold" fill="#111">72,41</text>
  <path d="M145 110 L180 125 L145 125" fill="#2a6fbe"/>
  <text x="280" y="135" font-size="14" fill="#333" text-anchor="middle">Après × 10 → 724,1 (les chiffres glissent vers la gauche, la virgule reste)</text>
