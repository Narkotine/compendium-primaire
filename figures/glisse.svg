<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" font-family="sans-serif">
  <text x="280" y="22" font-size="16" font-weight="bold" text-anchor="middle">× 10 : chaque chiffre monte d'un rang</text>
  <!-- headers -->
  <g font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">
    <rect x="40" y="40" width="70" height="22" fill="#2c7a49"/><text x="75" y="55">Dizaines</text>
    <rect x="110" y="40" width="70" height="22" fill="#a87408"/><text x="145" y="55">Unités</text>
    <rect x="180" y="40" width="70" height="22" fill="#2a6fbe"/><text x="215" y="55">Dixièmes</text>
    <rect x="250" y="40" width="80" height="22" fill="#d1495b"/><text x="290" y="55">Centièmes</text>
  </g>
  <g font-size="26" font-weight="bold" text-anchor="middle" fill="#111">
    <rect x="40" y="62" width="70" height="36" fill="#fff" stroke="#222"/><text x="75" y="88">7</text>
    <rect x="110" y="62" width="70" height="36" fill="#fff" stroke="#222"/><text x="145" y="88">2</text>
