<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="sans-serif">
  <text x="280" y="28" font-size="26" font-weight="bold" text-anchor="middle" fill="#111">2,37 = 2 + 3/10 + 7/100</text>
  <g transform="translate(40,50)">
    <rect width="70" height="70" fill="#a87408" stroke="#222" stroke-width="2" rx="6"/>
    <text x="35" y="32" font-size="28" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
    <text x="35" y="58" font-size="12" text-anchor="middle" fill="#fff">unités</text>
  </g>
  <text x="130" y="95" font-size="28" font-weight="bold" fill="#111">,</text>
  <g transform="translate(150,50)">
    <rect width="70" height="70" fill="#2a6fbe" stroke="#222" stroke-width="2" rx="6"/>
    <text x="35" y="32" font-size="28" font-weight="bold" text-anchor="middle" fill="#fff">3</text>
    <text x="35" y="58" font-size="11" text-anchor="middle" fill="#fff">dixièmes</text>
  </g>
  <g transform="translate(240,50)">
    <rect width="80" height="70" fill="#d1495b" stroke="#222" stroke-width="2" rx="6"/>
    <text x="40" y="32" font-size="28" font-weight="bold" text-anchor="middle" fill="#fff">7</text>
    <text x="40" y="58" font-size="11" text-anchor="middle" fill="#fff">centièmes</text>
  </g>
  <text x="380" y="80" font-size="15" fill="#333">La virgule sépare</text>
  <text x="380" y="100" font-size="15" fill="#333">les unités des dixièmes.</text>
</svg>
