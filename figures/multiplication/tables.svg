<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24" role="img"><title>Astuces des tables : × 2 le double ; × 4 le double du double ; × 8 le double de × 4 ; × 5 la moitié de × 10 ; × 9, × 10 moins une fois ; × 3, × 2 plus une fois.</title><rect x="6" y="6" width="328" height="40" rx="10" fill="#fff" stroke="#2a6fbe" stroke-width="2.5"/><rect x="6" y="6" width="58" height="40" rx="10" fill="#2a6fbe" stroke="none" stroke-width="1.5"/><rect x="50" y="6" width="14" height="40" fill="#2a6fbe" stroke="none" stroke-width="1.5"/><text x="35" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff">× 2</text><text x="74" y="32" text-anchor="start" font-size="16" font-weight="bold" fill="#2a6fbe">le double</text><text x="324" y="33" text-anchor="end" font-size="18" font-weight="bold">7 × 2 = 14</text><rect x="6" y="52" width="328" height="40" rx="10" fill="#fff" stroke="#3c9a5f" stroke-width="2.5"/><rect x="6" y="52" width="58" height="40" rx="10" fill="#3c9a5f" stroke="none" stroke-width="1.5"/><rect x="50" y="52" width="14" height="40" fill="#3c9a5f" stroke="none" stroke-width="1.5"/><text x="35" y="80" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff">× 4</text><text x="74" y="78" text-anchor="start" font-size="16" font-weight="bold" fill="#3c9a5f">double du double</text><text x="324" y="79" text-anchor="end" font-size="18" font-weight="bold">6 × 4 = 24</text><rect x="6" y="98" width="328" height="40" rx="10" fill="#fff" stroke="#6a4bb5" stroke-width="2.5"/><rect x="6" y="98" width="58" height="40" rx="10" fill="#6a4bb5" stroke="none" stroke-width="1.5"/><rect x="50" y="98" width="14" height="40" fill="#6a4bb5" stroke="none" stroke-width="1.5"/><text x="35" y="126" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff">× 8</text><text x="74" y="124" text-anchor="start" font-size="16" font-weight="bold" fill="#6a4bb5">double de × 4</text><text x="324" y="125" text-anchor="end" font-size="18" font-weight="bold">7 × 8 = 56</text><rect x="6" y="144" width="328" height="40" rx="10" fill="#fff" stroke="#e0a21b" stroke-width="2.5"/><rect x="6" y="144" width="58" height="40" rx="10" fill="#e0a21b" stroke="none" stroke-width="1.5"/><rect x="50" y="144" width="14" height="40" fill="#e0a21b" stroke="none" stroke-width="1.5"/><text x="35" y="172" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff">× 5</text><text x="74" y="170" text-anchor="start" font-size="16" font-weight="bold" fill="#7a5a10">moitié de × 10</text><text x="324" y="171" text-anchor="end" font-size="18" font-weight="bold">8 × 5 = 40</text><rect x="6" y="190" width="328" height="40" rx="10" fill="#fff" stroke="#d1495b" stroke-width="2.5"/><rect x="6" y="190" width="58" height="40" rx="10" fill="#d1495b" stroke="none" stroke-width="1.5"/><rect x="50" y="190" width="14" height="40" fill="#d1495b" stroke="none" stroke-width="1.5"/><text x="35" y="218" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff">× 9</text><text x="74" y="216" text-anchor="start" font-size="16" font-weight="bold" fill="#d1495b">× 10, moins 1 fois</text><text x="324" y="217" text-anchor="end" font-size="18" font-weight="bold">7 × 9 = 63</text><rect x="6" y="236" width="328" height="40" rx="10" fill="#fff" stroke="#2a6f97" stroke-width="2.5"/><rect x="6" y="236" width="58" height="40" rx="10" fill="#2a6f97" stroke="none" stroke-width="1.5"/><rect x="50" y="236" width="14" height="40" fill="#2a6f97" stroke="none" stroke-width="1.5"/><text x="35" y="264" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff">× 3</text><text x="74" y="262" text-anchor="start" font-size="16" font-weight="bold" fill="#2a6f97">× 2, plus 1 fois</text><text x="324" y="263" text-anchor="end" font-size="18" font-weight="bold">6 × 3 = 18</text></svg>
